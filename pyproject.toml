[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-watcher"
version = "0.1.0"
description = "Local anime watch-together automation using VLC and Ollama"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "watchdog>=4.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "imagehash>=4.3.1",
    "tenacity>=8.2.0",
]

[project.scripts]
anime-watcher = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
